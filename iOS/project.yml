name: OrcaSlicer
options:
  bundleIdPrefix: com.orcaslicer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"

targets:
  OrcaSlicer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OrcaSlicer
        excludes:
          - "Preview Content"
    resources:
      - path: OrcaSlicer/Resources/Assets.xcassets
      - path: OrcaSlicer/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orcaslicer.ios
        PRODUCT_NAME: OrcaSlicer
        MARKETING_VERSION: "2.4.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OrcaSlicer/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: OrcaSlicer/Bridge/BridgingHeader.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_INPUT_FILETYPE: "sourcecode.cpp.objcpp"
        # libslic3r linkage - paths set after running build_libslic3r_ios.sh
        HEADER_SEARCH_PATHS: >
          $(inherited)
          $(SRCROOT)/../src
          $(SRCROOT)/../src/libslic3r
          $(SRCROOT)/build/device/src/libslic3r
          $(SRCROOT)/build/deps/OS/OrcaSlicer_dep/usr/local/include
          $(SRCROOT)/build/deps/OS/OrcaSlicer_dep/usr/local/include/eigen3
        LIBRARY_SEARCH_PATHS: >
          $(inherited)
          $(SRCROOT)/build/device/src/libslic3r
          $(SRCROOT)/build/deps/OS/OrcaSlicer_dep/usr/local/lib
        OTHER_LDFLAGS: >
          $(inherited)
          -llibslic3r
          -llibslic3r_cgal
          -lz
          -lc++
        # Set ORCA_HAS_LIBSLIC3R=1 when libslic3r is built, 0 for stub mode
        GCC_PREPROCESSOR_DEFINITIONS: >
          $(inherited)
          ORCA_HAS_LIBSLIC3R=0
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - framework: build/OrcaSlicerCore.xcframework
        optional: true
        embed: false
    info:
      path: OrcaSlicer/Info.plist
    entitlements:
      path: OrcaSlicer/OrcaSlicer.entitlements

schemes:
  OrcaSlicer:
    build:
      targets:
        OrcaSlicer: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
